name: Instagram Reels 9-Slot Cloud Scheduler

on:
  schedule:
    # --- 🌅 MORNING WINDOW (3 SLOTS) ---
    # Slot 1: 06:30 AM IST = 01:00 UTC
    - cron: '0 1 * * *'
    # Slot 2: 07:10 AM IST = 01:40 UTC
    - cron: '40 1 * * *'
    # Slot 3: 08:00 AM IST = 02:30 UTC
    - cron: '30 2 * * *'

    # --- ☀️ AFTERNOON WINDOW (3 SLOTS) ---
    # Slot 4: 12:00 PM IST = 06:30 UTC
    - cron: '30 6 * * *'
    # Slot 5: 12:45 PM IST = 07:15 UTC
    - cron: '15 7 * * *'
    # Slot 6: 01:35 PM IST = 08:05 UTC
    - cron: '5 8 * * *'

    # --- 🌆 EVENING WINDOW (3 SLOTS) ---
    # Slot 7: 06:30 PM (18:30) IST = 13:00 UTC
    - cron: '0 13 * * *'
    # Slot 8: 07:45 PM (19:45) IST = 14:15 UTC
    - cron: '15 14 * * *'
    # Slot 9: 08:15 PM (20:15) IST = 14:45 UTC
    - cron: '45 14 * * *'

  workflow_dispatch:
    # Allows manual trigger at any time from GitHub Actions UI

jobs:
  publish-next-queued-reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests python-dotenv

      - name: Execute Cloud Queue Publisher
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python github_cloud_publisher.py
